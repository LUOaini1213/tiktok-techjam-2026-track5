name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Run tests (dataset-dependent tests skip on a clean checkout)
        env:
          OMP_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest tests/ -q
      - name: README numbers still regenerate from results/
        # The README's result blocks are generated from results/*.csv. Regenerate them on a
        # clean checkout and fail if anything moved: a hand-edited AUC, or a results/ file
        # changed without re-running the script, both show up here as a non-empty diff.
        run: |
          python scripts/update_readme.py
          git diff --exit-code README.md
      - name: Inference contract smoke test
        run: |
          python infer.py --input_dir samples --output preds.json
          python - <<'PY'
          import json, pathlib
          rows = json.load(open("preds.json", encoding="utf-8"))
          assert len(rows) == 2 and all(set(r) == {"image_path", "pred"} for r in rows)
          assert all(0.0 <= r["pred"] <= 1.0 for r in rows)
          # 0 <= pred <= 1 alone survives a swapped head or a drifted encoder: this fixture's
          # score has already moved from 0.6884 to 0.0374 between two green runs. Pin it.
          golden = json.load(open("tests/golden_smoke.json", encoding="utf-8"))
          tol, expected = golden["tolerance"], golden["tta"]
          for r in rows:
              name = pathlib.PurePath(r["image_path"]).name
              assert abs(r["pred"] - expected[name]) < tol, (name, r["pred"], expected[name])
          print("preds.json ok, matches tests/golden_smoke.json:", rows)
          PY
