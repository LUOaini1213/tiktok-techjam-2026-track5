name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Run tests (dataset-dependent tests skip on a clean checkout)
        env:
          OMP_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest tests/ -q
      - name: Submission contract smoke test
        run: |
          python infer.py --input_dir samples --output preds.json
          python - <<'PY'
          import json
          rows = json.load(open("preds.json", encoding="utf-8"))
          assert len(rows) == 2 and all(set(r) == {"image_path", "pred"} for r in rows)
          assert all(0.0 <= r["pred"] <= 1.0 for r in rows)
          print("preds.json ok:", rows)
          PY
