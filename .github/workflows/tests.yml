name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU torch + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest -c constraints-v3.txt
      - name: Historical source and artifact receipts (no model load)
        run: |
          python scripts/check_encoder_receipts.py
          python -O scripts/check_encoder_receipts.py
      - name: Run tests (dataset-dependent tests skip on a clean checkout)
        env:
          OMP_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest tests/ -q
      - name: Submission contract smoke test
        env:
          OMP_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          import json, subprocess, sys
          for weights in ("artifacts/repostguard.joblib", "results/v4/repostguard.joblib"):
              result = subprocess.run([sys.executable, "infer.py", "--input_dir", "samples", "--output", "preds.json", "--weights", weights], text=True, capture_output=True)
              print(result.stdout)
              print(result.stderr, file=sys.stderr)
              assert result.returncode == 0, weights
              assert "WARNING: failed to score " not in result.stderr, "Valid samples must be scored, not silently replaced by fallback values"
              rows = json.load(open("preds.json", encoding="utf-8"))
              assert len(rows) == 2 and all(set(r) == {"image_path", "pred"} for r in rows)
              assert all(0.0 <= r["pred"] <= 1.0 for r in rows)
              print(weights, "preds.json ok:", rows)
          PY
